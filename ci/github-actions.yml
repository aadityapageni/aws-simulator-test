name: Integration Tests with AWS Emulator

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-with-aws-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r examples/python-boto3/requirements.txt

      - name: Install AWS Emulator (Debian package)
        run: |
          curl -fsSLo aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y ./aws-emulator.deb
          aws-emulator -v

      - name: Run integration tests against local AWS Emulator
        run: |
          # Start emulator in background with a 120s idle timeout and telemetry off
          aws-emulator --idle-timeout 120 --telemetry off &
          EMULATOR_PID=$!
          trap 'kill -TERM $EMULATOR_PID 2>/dev/null || true' EXIT

          # Wait up to 30 seconds for the HTTPS health route to return "ok"
          for i in $(seq 30); do
            if [ -f ~/.aws/emulator/9297/ca.pem ] && \
               curl -sf --cacert ~/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health; then
              echo "AWS Emulator is ready!"
              break
            fi
            sleep 1
          done

          # Configure SDK environment variables and unset any real credentials
          source examples/env-setup.sh 9297

          # Run pytest suite
          pytest -v examples/python-boto3/
